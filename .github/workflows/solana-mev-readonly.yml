name: Solana Mainnet MEV Read-Only

on:
  push:
    branches:
      - feature/solana-mainnet-mev-readonly
    paths:
      - "phase4-mev-readonly/**"
      - ".github/workflows/solana-mev-readonly.yml"
  pull_request:
    paths:
      - "phase4-mev-readonly/**"
      - ".github/workflows/solana-mev-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: phase4-mev-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build with captured diagnostics
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          {
            echo '### TypeScript build output'
            echo '~~~text'
            cat build.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-build-diagnostics
          path: phase4-mev-readonly/build.log
          if-no-files-found: ignore
