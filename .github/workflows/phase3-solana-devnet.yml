name: Phase 3 - Solana Devnet E2E

on:
  push:
    branches:
      - "phase-3/solana-devnet-e2e"
  workflow_dispatch:

jobs:
  solana-devnet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install E2E harness
        working-directory: phase3/solana-devnet
        run: npm install --no-audit --no-fund
      - name: Generate ephemeral Devnet keypair
        working-directory: phase3/solana-devnet
        run: |
          node --input-type=module -e 'import { Keypair } from "@solana/web3.js"; import { writeFileSync } from "node:fs"; writeFileSync("/tmp/phase3-keypair.json", JSON.stringify(Array.from(Keypair.generate().secretKey)))'
      - name: Install Devnet proof-of-work faucet CLI
        run: cargo install devnet-pow --version 0.1.4
      - name: Fund ephemeral signer from Devnet PoW faucet
        run: devnet-pow mine --target-lamports 20000000 --url dev --keypair-path /tmp/phase3-keypair.json
      - name: Run Solana Devnet E2E
        working-directory: phase3/solana-devnet
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          SOLANA_KEYPAIR_PATH: /tmp/phase3-keypair.json
        run: npm run e2e
