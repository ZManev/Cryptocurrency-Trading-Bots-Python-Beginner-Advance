name: AI Terminal CI
on:
  push:
    branches: ["feature/ai-multi-agent-terminal-foundation"]
    paths: ["ai-terminal/**"]
  pull_request:
    paths: ["ai-terminal/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
