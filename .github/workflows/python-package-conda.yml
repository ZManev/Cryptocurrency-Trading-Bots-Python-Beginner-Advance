name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        conda install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install pytest
        pytest

  solana-devnet-e2e:
    name: Phase 3 - Solana Devnet E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install E2E harness
        working-directory: phase3/solana-devnet
        run: npm install --no-audit --no-fund
      - name: Generate ephemeral Devnet keypair
        working-directory: phase3/solana-devnet
        run: |
          node --input-type=module -e 'import { Keypair } from "@solana/web3.js"; import { writeFileSync } from "node:fs"; writeFileSync("/tmp/phase3-keypair.json", JSON.stringify(Array.from(Keypair.generate().secretKey)))'
      - name: Install Devnet proof-of-work faucet CLI
        run: cargo install devnet-pow --version 0.1.4
      - name: Fund ephemeral signer from Devnet PoW faucet
        run: devnet-pow mine --target-lamports 20000000 --url dev --keypair-path /tmp/phase3-keypair.json
      - name: Run Solana Devnet E2E
        working-directory: phase3/solana-devnet
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          SOLANA_KEYPAIR_PATH: /tmp/phase3-keypair.json
        run: npm run e2e
