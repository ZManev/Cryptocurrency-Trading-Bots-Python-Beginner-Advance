name: Python Package using Conda

on:
  push:
    branches:
      - "phase-3/solana-devnet-e2e"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        conda install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install pytest
        pytest

  solana-devnet-e2e:
    name: Phase 3 - Solana Devnet E2E + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crypto_platform
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: phase3_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize PostgreSQL ledger
        env:
          PGPASSWORD: phase3_ci_password
        run: psql -h 127.0.0.1 -U crypto -d crypto_platform -f phase3/database/001_phase3_ledger.sql
      - name: Install E2E harness
        working-directory: phase3/solana-devnet
        run: npm install --no-audit --no-fund
      - name: Run Solana Devnet E2E + ledger reconciliation
        working-directory: phase3/solana-devnet
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_AIRDROP_LAMPORTS: 500000000
          SOLANA_CONFIRM_TIMEOUT_MS: 90000
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: crypto_platform
          PGUSER: crypto
          PGPASSWORD: phase3_ci_password
        run: npm run e2e
